name: V5 1000 Ad Stress Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'database.py'
      - 'v5_engine.py'
      - 'analyzer.py'
      - '.github/workflows/v5-stress.yml'

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Run 1000-ad zero-credit stress test
        env:
          DATABASE_PATH: /tmp/product_hunter_stress.db
        run: |
          python - <<'PY'
          import os
          import time
          from app import app

          assert not os.environ.get('ANTHROPIC_API_KEY'), 'Stress test must be zero-credit'
          c=app.test_client()
          total=1000
          batch=50
          chunks=[]
          product_lines=[
              ('Ryggstöd', 'Slipp stel rygg och obehag varje dag. Bekväm ergonomisk lösning för hem och bil.'),
              ('Rengöringsborste', 'Spara tid vid städning. Elektrisk borste rengör badrum och fogar enklare.'),
              ('Förvaringslösning', 'Slipp stök hemma varje dag. Håller ordning och gör vardagen enklare.'),
              ('Sömnkudde', 'Vaknar du stel? Bekväm kudde för bättre sömn och stöd för nacke.'),
              ('Bilorganizer', 'Slipp röra i bilen. Smart förvaring håller saker på plats varje dag.'),
          ]
          for start in range(0,total,batch):
              ads=[]
              for i in range(start,min(start+batch,total)):
                  name,copy=product_lines[i % len(product_lines)]
                  company=f'Brand{i % 83:02d}'
                  day=(i % 27)+1
                  month=['jan','feb','mar','apr','maj','jun'][i % 6]
                  ad=f'''Company: {company}\nProduct: {name}\n{company}\nSponsrad\n{copy}\nAktiv\nBiblioteks-id: {88000000000000000+i}\n{day} {month} 2026\n'''
                  ads.append(ad)
              chunks.append('\n\n---\n\n'.join(ads))

          t0=time.time()
          r=c.post('/api/jobs',json={'country':'SE','keyword':'slipp','total_chunks':len(chunks)})
          assert r.status_code==201, r.data
          job=r.get_json()['job_id']
          for idx,raw in enumerate(chunks):
              r=c.post(f'/api/jobs/{job}/chunks',json={'chunk_index':idx,'raw':raw})
              assert r.status_code==200, (idx,r.data[:500])

          top=c.get('/api/top').get_json()
          elapsed=time.time()-t0
          assert top['library_count']==1000, top
          assert top['cluster_count']>=5, top
          assert 1 <= len(top['top5']) <= 5, top
          health=c.get('/health').get_json()
          assert health['engine']=='V5 Zero Credit'
          print(f'1000 ADS OK in {elapsed:.2f}s | clusters={top["cluster_count"]} | top5={len(top["top5"])}')
          PY
