name: V5 Final Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'analyzer.py'
      - 'database.py'
      - 'v5_engine.py'
      - 'claude_ranker.py'
      - 'hybrid_view.py'
      - 'static/app.js'
      - 'static/persistence.js'
      - 'static/emotion-ui.js'
      - 'static/hybrid-ui.js'
      - 'templates/index.html'
      - 'render.yaml'
      - 'requirements.txt'
      - '.github/workflows/v5-final-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Syntax
        run: |
          node --check static/app.js
          node --check static/persistence.js
          node --check static/emotion-ui.js
          node --check static/hybrid-ui.js
          python -m compileall -q app.py analyzer.py database.py v5_engine.py claude_ranker.py hybrid_view.py local_intelligence.py local_worker.py
      - name: Verify core behavior without key
        env:
          DATABASE_PATH: /tmp/product_hunter_final_audit.db
        run: |
          rm -f /tmp/product_hunter_final_audit.db
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          assert not os.environ.get('ANTHROPIC_API_KEY')
          from analyzer import ad_runtime_info
          from v5_engine import prepare_ad
          from app import app

          inactive=ad_runtime_info('Inaktiv\n29 okt 2025\n30 okt 2025')
          assert inactive['status']=='inactive' and inactive['days']==2, inactive
          active=ad_runtime_info('Aktiv\n29 okt 2025')
          expected=(datetime.now(timezone.utc).date()-datetime(2025,10,29).date()).days+1
          assert active['status']=='active' and active['days']==expected, active

          raw='''Company: TestBrand\nProduct: Ergonomiskt ryggstöd\nTestBrand\nSponsrad\nSlipp stel rygg och obehag varje dag. Bekväm ergonomisk lösning för hem och bil.\nAktiv\nBiblioteks-id: 990000000000001\n1 jan 2026\n'''
          se=prepare_ad(raw,'SE','slipp'); de=prepare_ad(raw,'DE','müde von')
          for key in ['problem_strength','severity_score','frequency_score','emotion_score','fit35_score','evergreen_score','clarity_score','value_score','demo_score','broad_market_score','direct_response_score','trend_penalty','compliance_penalty','commodity_penalty','confidence_score','base_score','willingness_to_pay','data_quality']:
              assert se.get(key)==de.get(key),(key,se.get(key),de.get(key))

          c=app.test_client(); sj=c.get('/api/status').get_json()
          assert sj['zero_credit_default'] is True,sj
          assert sj['zero_credit_fallback'] is True,sj
          assert sj['engine']=='V5 Deterministic Fallback',sj
          assert sj['claude_auto'] is False,sj

          ad1='''Company: BrandA\nProduct: Rengöringsborste\nBrandA\nSponsrad\nSpara tid vid städning. Elektrisk borste rengör badrum och fogar enklare.\nAktiv\nBiblioteks-id: 990000000000101\n1 jan 2026\n'''
          ad2='''Company: BrandB\nProduct: Sömnkudde\nBrandB\nSponsrad\nVaknar du stel? Bekväm kudde för bättre sömn och stöd för nacke.\nAktiv\nBiblioteks-id: 990000000000102\n1 feb 2026\n'''
          raw_chunk=ad1+'\n\n---\n\n'+ad2
          job=c.post('/api/jobs',json={'country':'SE','keyword':'slipp','total_chunks':1})
          job_id=job.get_json()['job_id']
          first=c.post(f'/api/jobs/{job_id}/chunks',json={'chunk_index':0,'raw':raw_chunk})
          assert first.status_code==200,first.data
          fj=first.get_json(); assert fj['chunk_new']==2 and fj['status']=='done',fj
          assert 'claude' in fj and fj['claude'].get('error'),fj

          replay=c.post(f'/api/jobs/{job_id}/chunks',json={'chunk_index':0,'raw':raw_chunk})
          assert replay.status_code==200 and replay.get_json().get('already_done') is True,replay.data
          top=c.get('/api/top').get_json()
          assert top['library_count']==2 and 1<=top['cluster_count']<=2 and 1<=len(top['top5'])<=2,top

          changed=ad1.replace('Spara tid vid städning.','HELT NY COPY men samma riktiga Meta-annons.')
          dup=c.post('/api/analyze',json={'country':'SE','keyword':'slipp','raw':changed}).get_json()
          assert dup['count']==0 and dup['duplicates_skipped']==1 and dup['library_count']==2,dup
          assert c.post('/api/clusters/1/deep-review').status_code==503

          reset=c.post('/api/reset'); assert reset.status_code==200
          after=c.get('/api/top').get_json(); assert after['library_count']==0 and after['top5']==[],after
          print('FINAL AUDIT OK: fallback, dates, neutrality, idempotency, dedupe, reset')
          PY
      - name: Verify deployment config
        run: |
          grep -q 'healthCheckPath: /health' render.yaml
          grep -q 'key: DATABASE_URL' render.yaml
          grep -q 'psycopg2-binary' requirements.txt
          grep -q 'hybrid-ui.js' templates/index.html
