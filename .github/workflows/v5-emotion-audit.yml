name: V5 Problem Emotion Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v5_engine.py'
      - 'analyzer.py'
      - 'app.py'
      - 'static/emotion-ui.js'
      - 'templates/index.html'
      - '.github/workflows/v5-emotion-audit.yml'

jobs:
  emotion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: JavaScript syntax
        run: node --check static/emotion-ui.js
      - name: Verify problem and emotional buying signals
        env:
          DATABASE_PATH: /tmp/product_hunter_emotion_audit.db
        run: |
          rm -f /tmp/product_hunter_emotion_audit.db
          python - <<'PY'
          from v5_engine import prepare_ad, _cluster_soft_scores

          strong_raw = '''Company: ReliefBrand
Product: Ergonomisk nackkudde
ReliefBrand
Sponsrad
Trött på att vakna varje morgon med stel nacke och värk? Jag kan inte sova ordentligt och det gör ont varje dag. Äntligen en bekväm lösning som ger lättnad och stöd. Se skillnaden på sekunder.
Aktiv
Biblioteks-id: 991100000000001
1 jan 2026
'''

          weak_raw = '''Company: TrendBrand
Product: Färgad mini-lampa
TrendBrand
Sponsrad
Viral TikTok aesthetic cute gadget. Trending must-have med snygga färger och limited drop.
Aktiv
Biblioteks-id: 991100000000002
1 jan 2026
'''

          strong = prepare_ad(strong_raw, 'SE', 'trött på')
          weak = prepare_ad(weak_raw, 'SE', 'viral')

          for key in ('problem_strength','severity_score','frequency_score','emotion_score'):
              assert strong[key] > weak[key], (key, strong[key], weak[key])

          strong_metrics = [{
              'problem_strength': strong['problem_strength'],
              'severity_score': strong['severity_score'],
              'frequency_score': strong['frequency_score'],
              'emotion_score': strong['emotion_score'],
              'clarity_score': strong['clarity_score'],
              'demo_score': strong['demo_score'],
              'direct_response_score': strong['direct_response_score'],
          }]
          weak_metrics = [{
              'problem_strength': weak['problem_strength'],
              'severity_score': weak['severity_score'],
              'frequency_score': weak['frequency_score'],
              'emotion_score': weak['emotion_score'],
              'clarity_score': weak['clarity_score'],
              'demo_score': weak['demo_score'],
              'direct_response_score': weak['direct_response_score'],
          }]
          s = _cluster_soft_scores(strong_metrics)
          w = _cluster_soft_scores(weak_metrics)

          assert s['problem_solving'] > w['problem_solving'], (s, w)
          assert s['emotional_pressure'] > w['emotional_pressure'], (s, w)
          assert s['purchase_urgency'] > w['purchase_urgency'], (s, w)
          assert s['problem_solving'] >= 6.0, s
          assert s['emotional_pressure'] >= 5.0, s
          assert w['emotional_pressure'] < 5.0, w

          # Research country must never affect these scores.
          strong_de = prepare_ad(strong_raw, 'DE', 'müde von')
          for key in ('problem_strength','severity_score','frequency_score','emotion_score','demo_score'):
              assert strong[key] == strong_de[key], (key, strong[key], strong_de[key])

          print('EMOTION AUDIT OK', {'strong': s, 'weak': w})
          PY
